<title>SharkNinja India Review Sentiment</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>

    --surface-sunk: #eceff0;
    --line: #dde1e2;

    --teal-wash: #e2f4f5;
    --critical: #c1352d;
    --critical-wash: #fbeceb;
    --caution: #a4700a;
    --caution-wash: #fbf3e2;

    --display: "Archivo", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0d1011;
      --surface: #161a1b;
      --surface-sunk: #1e2324;
      --line: #2a3032;
      --line-strong: #3c4446;
      --ink: #eef1f1;
      --ink-muted: #98a2a4;
      --teal: #2ec0c9;
      --teal-deep: #7fdbe1;
      --teal-wash: #102e31;
      --critical: #e8756c;
      --critical-wash: #331917;
      --caution: #d9a53f;
      --caution-wash: #2e2513;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --ground: #0d1011;
    --surface: #161a1b;
    --surface-sunk: #1e2324;
    --line: #2a3032;
    --line-strong: #3c4446;
    --ink: #eef1f1;
    --ink-muted: #98a2a4;
    --teal: #2ec0c9;
    --teal-deep: #7fdbe1;
    --teal-wash: #102e31;
    --critical: #e8756c;
    --critical-wash: #331917;
    --caution: #d9a53f;
    --caution-wash: #2e2513;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .num { font-family: var(--data); font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------------- chrome */

  header.top {
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .top-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .wordmark {
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    cursor: pointer;
  }
  .wordmark span { color: var(--teal); }
  .provenance {
    font-size: 12px;
    color: var(--ink-muted);
  }

  main { max-width: 1080px; margin: 0 auto; padding: 28px 24px 72px; }

  .crumbs {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }
  .crumbs button {
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    color: var(--ink-muted);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--line-strong);
  }
  .crumbs button:hover { color: var(--ink); }

  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 30px;
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
  }
  .subhead { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-muted); }

  .section-label {
    font-family: var(--display);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .stack-tight { display: flex; flex-direction: column; gap: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 780px) { .row2 { grid-template-columns: 1fr; } }

  /* ------------------------------------------------------------ level one */

  .brand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 22px; }
  @media (max-width: 780px) { .brand-grid { grid-template-columns: 1fr; } }

    width: 100%;

    font-weight: 600;
    font-size: 40px;

  /* ------------------------------------------------------------- measures */

  @media (max-width: 780px) { .compare { grid-template-columns: 1fr; } }
  .measure {

  .measure-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;

  .measure-value {
    font-family: var(--data);

  .bar { display: flex; height: 8px; background: var(--surface-sunk); overflow: hidden; margin-top: 16px; }

  .bar .pos { background: var(--teal); }

    width: 100%;
    text-align: left;

    border: 1px dashed var(--line-strong);
    background: var(--surface-sunk);
    color: var(--ink-muted);
    font-size: 13px;
    padding: 26px 20px;
    text-align: center;
  }

  .cloud { width: 100%; display: block; }

  .themes { list-style: none; margin: 16px 0 0; padding: 16px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }

  /* -------------------------------------------------------------- buckets */

  .bucket-fill.none { background: var(--line-strong); }

  table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 13.5px; }
  thead th {

    font-weight: 600;

  tbody tr:last-child td { border-bottom: 0; }
  th.r, td.r { text-align: right; }
  .sku-link { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: inherit; cursor: pointer; text-align: left; }
  .sku-link:hover { color: var(--teal); }

  .chip {

  .badge {

  .review-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
  .stars {
    font-family: var(--data);
    font-weight: 600;

  .review-meta { font-size: 12px; color: var(--ink-muted); }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 11px; color: var(--ink-muted); border: 1px solid var(--line); padding: 1px 7px; }

  footer.note {
    max-width: 1080px;
    margin: 0 auto;

    font-size: 12px;
    color: var(--ink-muted);

  button:focus-visible, a:focus-visible {

    outline-offset: 3px;

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<header class="top">
  <div class="top-inner">
    <button class="wordmark" onclick="go('/')">SharkNinja India <span>/ Review Sentiment</span></button>
    <span class="provenance" id="provenance"></span>
  </div>
</header>

<main id="app"></main>

<footer class="note">
  <p id="foot-a"></p>
  <p>Sentiment follows the rating: 4–5&#9733; positive, 3&#9733; neutral, 1–2&#9733; negative. Where a chart would be built on too few reviews it is withheld and says so, rather than drawing a shape from three people.</p>
</footer>

<script>window.DATA = __DATA__;</script>
<script>
const D = window.DATA;
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (n) => n.toFixed(0) + "%";
const score = (v) => (v === null ? "&mdash;" : v.toFixed(2));

document.getElementById("provenance").textContent =
  D.totalReviews + " Amazon.in reviews · " + D.rangeLabel;
document.getElementById("foot-a").textContent =
  "Reviews collected by hand from Amazon.in listings, " + D.collectedLabel +
  ". Verified figures count only reviews Amazon marks as a verified purchase.";

/* ------------------------------------------------------------- fragments */

function bar(s) {
  return `<div class="bar">
    <i class="pos" style="width:${s.pctPositive}%"></i>
    <i class="neu" style="width:${s.pctNeutral}%"></i>
    <i class="neg" style="width:${s.pctNegative}%"></i>
  </div>
  <div class="legend">
    <span><b>${pct(s.pctPositive)}</b> positive</span>
    <span><b>${pct(s.pctNeutral)}</b> neutral</span>
    <span><b>${pct(s.pctNegative)}</b> negative</span>
  </div>`;
}

function compare(v, a) {
  const panel = (s, label, note, lead) => `
    <div class="measure${lead ? " lead" : ""}">
      <div class="measure-head">
        <span class="section-label">${label}</span>
        <span class="num" style="font-size:12px;color:var(--ink-muted)">n=${s.n}</span>
      </div>
      <div class="measure-value">${score(s.avg)}<small> / 5</small></div>
      <p class="measure-note">${note}</p>
      ${bar(s)}
    </div>`;
  return `<div class="compare">
    ${panel(v, "Verified purchases", "The number to trust", true)}
    ${panel(a, "All reviews", "Includes unverified", false)}
  </div>`;
}

function cloudPanel(id, title, sub, cloud, themes, tone) {
  const body = cloud.ok
    ? `<svg class="cloud" id="${id}" height="250"></svg>`
    : `<div class="refused">${esc(cloud.reason)}</div>`;
  const list = themes.length
    ? `<ul class="themes">${themes
        .map(
          (t) =>
            `<li><span><i class="dot" style="background:${
              tone === "positive" ? "var(--teal)" : "var(--critical)"
            }"></i>${esc(t.phrase)}</span><span class="n">${t.reviews} reviews</span></li>`,
        )
        .join("")}</ul>`
    : "";
  return `<section class="panel">
    <h2>${title}</h2>
    <p class="panel-sub">${esc(sub)}</p>
    <div class="panel-body">${body}${list}</div>
  </section>`;
}

function buckets(b) {
  if (b.negatives === 0) {
    return `<p style="font-size:13.5px;color:var(--ink-muted);margin:0">No negative reviews here, so there is nothing to break down.</p>`;
  }
  const max = Math.max(...b.rows.map((r) => r.count), 1);
  return (
    b.rows
      .map(
        (r) => `<div class="bucket">
          <span class="bucket-name">${esc(r.bucket)}</span>
          <div class="bucket-track"><div class="bucket-fill${
            r.bucket === "Unclassified" ? " none" : ""
          }" style="width:${(r.count / max) * 100}%"></div></div>
          <span class="bucket-count">${r.count} &middot; ${pct(r.pct)}</span>
        </div>
        ${r.example ? `<p class="bucket-note">${esc(r.example)}</p>` : ""}`,
      )
      .join("") +
    `<p style="font-size:12px;color:var(--ink-muted);margin:14px 0 0">Percentages are of all ${b.negatives} negative reviews and sum past 100%, because one review can name several problems.</p>`
  );
}

/* ------------------------------------------------------------ word clouds */

function drawCloud(id, words, tone) {
  const svg = document.getElementById(id);
  if (!svg || !window.d3 || !d3.layout || !d3.layout.cloud) return;
  const width = svg.clientWidth || 480;
  const height = 250;
  const values = words.map((w) => w.value);
  const min = Math.min(...values);
  const max = Math.max(...values);
  const span = Math.max(1, max - min);
  const sized = words.map((w) => ({
    text: w.text,
    value: w.value,
    size: 12 + ((w.value - min) / span) * 32,
  }));

  d3.layout
    .cloud()
    .size([width, height])
    .words(sized)
    .padding(3)
    .rotate(0)
    .font("Archivo, sans-serif")
    .fontSize((d) => d.size)
    .on("end", (out) => {
      const shade = (v) => {
        const t = v / max;
        if (tone === "positive") return t > 0.6 ? "var(--teal)" : t > 0.3 ? "var(--teal-deep)" : "var(--ink-muted)";
        return t > 0.6 ? "var(--critical)" : t > 0.3 ? "var(--critical)" : "var(--ink-muted)";
      };
      const op = (v) => (v / max > 0.3 ? 1 : 0.72);
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.innerHTML =
        `<g transform="translate(${width / 2},${height / 2})">` +
        out
          .map(
            (w) =>
              `<text text-anchor="middle" transform="translate(${w.x.toFixed(1)},${w.y.toFixed(
                1,
              )})" style="font-family:Archivo,sans-serif;font-size:${w.size.toFixed(
                1,
              )}px;font-weight:${w.value / max > 0.5 ? 700 : 500};fill:${shade(
                w.value,
              )};opacity:${op(w.value)}">${esc(w.text)}</text>`,
          )
          .join("") +
        `</g>`;
    })
    .start();
}

function paintClouds(specs) {
  specs.forEach((s) => s.cloud.ok && drawCloud(s.id, s.cloud.words, s.tone));
}

/* ----------------------------------------------------------- trend chart */

function trendChart(points) {
  const w = 640, h = 230, padL = 34, padR = 16, padT = 14, padB = 30;
  const xs = (i) => padL + (i * (w - padL - padR)) / Math.max(1, points.length - 1);
  const ys = (v) => padT + (5 - v) * ((h - padT - padB) / 4);
  const line = points.map((p, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)},${ys(p.avg).toFixed(1)}`).join("");
  const grid = [1, 2, 3, 4, 5]
    .map(
      (v) =>
        `<line x1="${padL}" x2="${w - padR}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-width="1"/>
         <text x="${padL - 8}" y="${ys(v) + 4}" text-anchor="end" style="font-family:var(--data);font-size:10px;fill:var(--ink-muted)">${v}</text>`,
    )
    .join("");
  const dots = points
    .map(
      (p, i) =>
        `<circle cx="${xs(i).toFixed(1)}" cy="${ys(p.avg).toFixed(1)}" r="3.5" fill="var(--teal)"/>
         <text x="${xs(i).toFixed(1)}" y="${h - 10}" text-anchor="middle" style="font-family:var(--data);font-size:10px;fill:var(--ink-muted)">${esc(p.label)}</text>`,
    )
    .join("");
  return `<div class="table-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Monthly verified rating average">
    ${grid}
    <path d="${line}" fill="none" stroke="var(--teal)" stroke-width="2"/>
    ${dots}
  </svg></div>`;
}

/* --------------------------------------------------------------- screens */

function levelOne() {
  const cards = D.brands
    .map(
      (b) => `<button class="brand-card" onclick="go('/${b.slug}')">
        <h2>${esc(b.brand)}</h2>
        <p class="measure-note">${b.skuCount} SKUs &middot; ${b.all.n} reviews</p>
        <div class="brand-score">${score(b.verified.avg)}<small> / 5</small></div>
        <p class="measure-note">Verified average, n=${b.verified.n}</p>
        ${bar(b.verified)}
        <p style="margin:18px 0 0;font-size:13px;font-weight:600;color:var(--teal)">Open ${esc(b.brand)} &rarr;</p>
      </button>`,
    )
    .join("");

  return {
    html: `<h1>Two brands, ${D.totalReviews} reviews, one question: where is the damage?</h1>
      <p class="subhead">Amazon.in customer reviews across ${D.skuCount} SharkNinja India listings, ${D.rangeLabel}. Start with a brand.</p>
      <div class="brand-grid">${cards}</div>`,
    clouds: [],
  };
}

function levelTwo(slug) {
  const v = D.brandViews[slug];
  const flag = (kind, label, s) =>
    s
      ? `<button class="flag ${kind === "good" ? "good" : "bad"}" onclick="go('/${slug}/${s.id}')">
          <span class="section-label">${label}</span>
          <h3>${esc(s.name)}</h3>
          <p class="measure-note"><span class="num" style="font-size:19px;color:var(--ink)">${score(
            s.avg,
          )}</span> &nbsp;${s.n} verified &middot; ${pct(s.pctNegative)} negative</p>
          <p class="why">Ranked on verified average, across only the ${v.rankedFrom} ${esc(
            v.brand,
          )} SKUs with at least 10 verified reviews. The other ${v.skus.length - v.rankedFrom} are too thin to rank.</p>
        </button>`
      : `<div class="flag"><span class="section-label">${label}</span><p class="measure-note">No SKU has enough verified reviews to rank.</p></div>`;

  const rows = v.skus
    .map(
      (s) => `<tr>
        <td><button class="sku-link" onclick="go('/${slug}/${s.id}')">${esc(s.name)}</button>${
          s.insufficient ? '<span class="chip">low n</span>' : ""
        }</td>
        <td class="r num">${s.all.n}</td>
        <td class="r num">${score(s.verified.avg)}</td>
        <td class="r num">${s.all.n ? pct(s.all.pctNegative) : "&mdash;"}</td>
        <td style="width:150px;padding-left:18px">${bar(s.all).split('<div class="legend">')[0]}</td>
      </tr>`,
    )
    .join("");

  return {
    html: `<div class="crumbs"><button onclick="go('/')">All brands</button><span>/</span><span>${esc(
      v.brand,
    )}</span></div>
      <h1>${esc(v.brand)}</h1>
      <p class="subhead">${v.all.n} reviews across ${v.skus.length} SKUs</p>
      <div class="stack" style="margin-top:22px">
        ${compare(v.verified, v.all)}
        <div class="row2">${flag("good", "Top performer", v.top)}${flag("bad", "Needs attention", v.bottom)}</div>
        <div class="row2">
          ${cloudPanel("c2p", "What praise sounds like", v.clouds.positive.ok ? `4–5★ language · ${v.clouds.positive.n} reviews` : "4–5★ language", v.clouds.positive, v.themes.positive, "positive")}
          ${cloudPanel("c2n", "What complaints sound like", v.clouds.negative.ok ? `1–2★ language · ${v.clouds.negative.n} reviews` : "1–2★ language", v.clouds.negative, v.themes.negative, "negative")}
        </div>
        <section class="panel">
          <h2>Problem areas</h2>
          <p class="panel-sub">${v.buckets.negatives} negative reviews across ${esc(v.brand)}</p>
          <div class="panel-body">${buckets(v.buckets)}</div>
        </section>
        <section class="panel">
          <h2>Every SKU</h2>
          <p class="panel-sub">Ordered by review volume. Click any row.</p>
          <div class="panel-body table-wrap">
            <table><thead><tr>
              <th>SKU</th><th class="r">Reviews</th><th class="r">Verified avg</th><th class="r">% negative</th>
              <th style="padding-left:18px">Split</th>
            </tr></thead><tbody>${rows}</tbody></table>
          </div>
        </section>
      </div>`,
    clouds: [
      { id: "c2p", cloud: v.clouds.positive, tone: "positive" },
      { id: "c2n", cloud: v.clouds.negative, tone: "negative" },
    ],
  };
}

function levelThree(slug, skuId) {
  const v = D.skuViews[skuId];
  const brand = D.brandViews[slug];

  const reviews = v.reviews
    .map(
      (r) => `<li>
        <div class="review-head">
          <span class="stars ${r.rating >= 4 ? "p" : r.rating === 3 ? "n" : "b"}">${r.rating}&#9733;</span>
          <span class="review-title">${esc(r.title || "Untitled")}</span>
          <span class="review-meta">${esc(r.reviewer)} &middot; ${esc(r.date)} &middot; ${
            r.verified ? "verified" : "unverified"
          }</span>
        </div>
        ${
          r.body
            ? `<p class="review-body">${esc(r.body)}</p>`
            : `<p class="review-body" style="font-style:italic">Title only &mdash; this reviewer left no text.</p>`
        }
        ${r.buckets.length ? `<div class="tags">${r.buckets.map((b) => `<span class="tag">${esc(b)}</span>`).join("")}</div>` : ""}
      </li>`,
    )
    .join("");

  return {
    html: `<div class="crumbs"><button onclick="go('/')">All brands</button><span>/</span><button onclick="go('/${slug}')">${esc(
      brand.brand,
    )}</button><span>/</span><span>${esc(v.name)}</span></div>
      <h1>${esc(v.name)}</h1>
      <p class="subhead">${v.all.n} review${v.all.n === 1 ? "" : "s"}${
        v.model ? " · " + esc(v.model) : ""
      } · <a href="${esc(v.url)}" target="_blank" rel="noreferrer" style="color:inherit">listing on Amazon.in</a></p>
      <div class="stack" style="margin-top:22px">
        ${
          v.insufficient
            ? `<div class="caveat"><b>Read this page as anecdote, not measurement.</b> With ${
                v.verified.n
              } verified review${
                v.verified.n === 1 ? "" : "s"
              } against a bar of 10, one unhappy customer moves the average by a full point. The figures are here for completeness, not for decisions.</div>`
            : ""
        }
        ${compare(v.verified, v.all)}
        <div class="row2">
          ${cloudPanel("c3p", "What people praise", v.clouds.positive.ok ? `4–5★ language · ${v.clouds.positive.n} reviews` : "4–5★ language", v.clouds.positive, v.themes.positive, "positive")}
          ${cloudPanel("c3n", "What people complain about", v.clouds.negative.ok ? `1–2★ language · ${v.clouds.negative.n} reviews` : "1–2★ language", v.clouds.negative, v.themes.negative, "negative")}
        </div>
        <section class="panel">
          <h2>Problem areas</h2>
          <p class="panel-sub">${v.buckets.negatives} negative review${
            v.buckets.negatives === 1 ? "" : "s"
          } for this SKU</p>
          <div class="panel-body">${buckets(v.buckets)}</div>
        </section>
        <section class="panel">
          <h2>Rating over time</h2>
          <p class="panel-sub">Monthly average, verified purchases only</p>
          <div class="panel-body">${
            v.trend.ok ? trendChart(v.trend.points) : `<div class="refused">${esc(v.trend.reason)}</div>`
          }</div>
        </section>
        <section class="panel">
          <h2>The reviews themselves</h2>
          <p class="panel-sub">Newest first &mdash; the text behind every figure above</p>
          <div class="panel-body"><ul class="reviews">${reviews}</ul></div>
        </section>
      </div>`,
    clouds: [
      { id: "c3p", cloud: v.clouds.positive, tone: "positive" },
      { id: "c3n", cloud: v.clouds.negative, tone: "negative" },
    ],
  };
}

/* ---------------------------------------------------------------- router */

function render() {
  const parts = (location.hash.replace(/^#\/?/, "") || "").split("/").filter(Boolean);
  let view;
  if (parts.length >= 2 && D.skuViews[parts[1]]) view = levelThree(parts[0], parts[1]);
  else if (parts.length >= 1 && D.brandViews[parts[0]]) view = levelTwo(parts[0]);
  else view = levelOne();

  const app = document.getElementById("app");
  app.innerHTML = view.html;
  window.scrollTo(0, 0);
  paintClouds(view.clouds);
}

function go(path) {
  location.hash = path === "/" ? "" : "#" + path;
  if (path === "/") render();
}

window.addEventListener("hashchange", render);
window.addEventListener("resize", () => clearTimeout(window.__rt) || (window.__rt = setTimeout(render, 200)));
render();
</script>
